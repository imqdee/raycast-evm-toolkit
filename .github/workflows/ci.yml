name: CI

# No run on a push to main: changes land through PRs, which run these jobs, and
# nothing reads main's runs (no deploy, no badge)
on:
  pull_request:
    branches: [main, "base/**"]

# A newer push to the same PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The job takes about 20s: fail a stalled step instead of waiting for it
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # The one check the repository ruleset requires. It fails when a job it waits on
  # failed or was cancelled, so every job that runs on a pull request is listed in `needs`
  ci-gate:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}" = false ]'
